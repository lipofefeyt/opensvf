site_name: OpenSVF
site_description: Open-source spacecraft software validation facility
site_url: https://opensvf.readthedocs.io
repo_url: https://github.com/lipofefeyt/opensvf
repo_name: lipofefeyt/opensvf

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
    - MySat-1 Quickstart: quickstart-mysat1.md
    - Plug In Your Own Binary: quickstart-own-binary.md
  - Concepts:
    - Architecture: architecture.md
    - Design Philosophy: design-philosophy.md
    - Abstraction Layer: abstraction-layer.md
  - Reference:
    - Equipment Library: equipment-library.md
    - pytest Plugin: plugin.md
    - SIL Attitude Validation: sil-attitude-validation-guide.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
