site_name: OpenSVF
site_description: Open-source spacecraft software validation facility
# Read the Docs sets the canonical URL per version; the fallback is for local builds.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://opensvf.readthedocs.io/"]
repo_url: https://github.com/lipofefeyt/opensvf
repo_name: lipofefeyt/opensvf
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy

# Not published: the docs toolchain pins, the sources of generated tables
# (docs/_gen/ from tools/gen_docs.py, included by snippets), the example
# files included by integrate-obsw.md (docs/examples/), and the data pack
# metadata and build files (docs/datapack/; tools/build_datapack.py renders
# the ADD, SVS and ICD PDFs from the site pages).
exclude_docs: |
  requirements.txt
  compatibility.yaml
  _gen/
  datapack/
  examples/

# Every warning fails `mkdocs build --strict`. A page that is neither in the
# nav nor excluded above is a warning too, so no page is published by accident.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search

# Same top-level sections as the openobsw site.
nav:
  - Getting started:
      - Overview: index.md
      - MySat-1 quickstart: quickstart-mysat1.md
      - Integrate your flight software: integrate-obsw.md
  - Concepts:
      - Architecture: architecture.md
      - Design philosophy: design-philosophy.md
      - Abstraction layer: abstraction-layer.md
      - OBC modes: obc-modes.md
      - Validation: validation.md
      - System tests: system-tests.md
  - Reference:
      - Compatibility: compatibility.md
      - Interfaces (ICD): icd.md
      - Equipment: equipment.md
      - Equipment library: equipment-library.md
      - YAMCS mission database: yamcs-mdb.md
      - pytest plugin: plugin.md
  - Known limits: known-limits.md
  - Releases: releases.md
