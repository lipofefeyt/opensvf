[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensvf"
version = "0.7.1"
description = "Open-source spacecraft software validation facility — SIL campaigns, physics-in-the-loop, HTML reports"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "fmpy>=0.3.20",
    "requests>=2.31",
    "pythonfmu>=0.6",
    "cyclonedds>=0.11",
    "pyyaml>=6.0",
    "pytest-timeout>=2.3",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/lipofefeyt/opensvf"
Documentation = "https://opensvf.readthedocs.io"
Repository = "https://github.com/lipofefeyt/opensvf"

[project.optional-dependencies]
uart = [
    "pyserial>=3.5",
]
dev = [
    "pytest>=7.4",
    "pytest-xdist",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
    "pyserial>=3.5",
]
docs = [
    "mkdocs-material>=9.5",
]

[project.scripts]
svf       = "svf.campaign.cli:main"
checkcov  = "svf.tools.checkcov:main"
checkcons = "svf.tools.checkcons:main"
testosvf  = "svf.tools.testosvf:main"
checkosvf = "svf.tools.checkosvf:main"

[project.entry-points."pytest11"]
svf = "svf.plugin"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"svf.data.hardware_profiles" = ["*.yaml"]

[tool.mypy]
strict = true
exclude = ["tools/"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["fmpy", "fmpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["obsw_srdb.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["serial", "serial.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
timeout = 30
log_cli = false
log_cli_level = "INFO"
log_format = "%(asctime)s %(name)s %(levelname)s %(message)s"
log_date_format = "%H:%M:%S"
python_classes = ["*Suite", "*Tests"]
testpaths = ["tests"]
norecursedirs = ["tests/system"]  # was tests/hardware

[tool.pylint.messages_control]
disable = [
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
]

[tool.pylint.format]
max-line-length = 100
