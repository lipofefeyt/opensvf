campaign: MySat-1 FreeRTOS HIL Integration Validation

# Default: stub OBC  -  procedures produce INCONCLUSIVE.
# Point spacecraft at spacecraft_hil.yaml to run the real openobsw binary.
# Against the host obsw_sim, TC-HIL-004 stays INCONCLUSIVE: FreeRTOS
# diagnostics need an STM32H7 target (Renode socket or serial).
spacecraft: ../spacecraft.yaml

requirements:
  - MIS-HIL-001
  - MIS-HIL-002
  - MIS-HIL-003
  - MIS-HIL-004
procedures:
  - ../procedures/freertos_hil_procedures.py
