# Read the Docs build (#200). Versions: one per release tag from 1.4.0, plus
# `latest` (main) as dev; activated in the Read the Docs project settings.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # Generated reference tables (docs/_gen/), included by the pages
    pre_build:
      - python tools/gen_docs.py

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
    # gen_docs.py builds every equipment model to list its ports
    - method: pip
      path: .
      extra_requirements:
        - orbital
