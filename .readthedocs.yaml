# Read the Docs build (#200). Versions: one per release tag from 1.4.0, plus
# `latest` (main) as dev; activated in the Read the Docs project settings.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
