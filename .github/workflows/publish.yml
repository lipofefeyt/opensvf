name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # required for PyPI trusted publishing

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/opensvf
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC trusted publishing  -  no API token needed.
        # One-time setup on PyPI:
        #   1. Go to https://pypi.org/manage/account/publishing/
        #   2. Add publisher: owner=lipofefeyt repo=opensvf workflow=publish.yml env=pypi

  release:
    name: Create GitHub release
    needs: publish            # only release what actually reached PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release from tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - leaving it untouched"
            exit 0
          fi
          # checkout may store the tag as lightweight; refetch the tag object
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            # Annotated tag: subject line is the title, body is the notes
            git tag -l --format='%(contents:body)' "$TAG" > notes.md
            gh release create "$TAG" dist/* \
              --title "$(git tag -l --format='%(contents:subject)' "$TAG")" \
              --notes-file notes.md --verify-tag
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
